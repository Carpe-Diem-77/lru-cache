<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, minimum-scale=1.0, initial-scale=1, user-scalable=yes" />
    <style>
      html {
        font-family: BlinkMacSystemFont,-apple-system,"Segoe UI",Roboto,Oxygen,Ubuntu,Cantarell,"Fira Sans","Droid Sans","Helvetica Neue",Helvetica,Arial,sans-serif;
        -webkit-font-smoothing: antialiased;
        background-color: #fff;
        font-size: 16px;
      }
      body {
        color: #4a4a4a;
        margin: 8px;
        font-size: 1em;
        font-weight: 400;
      }
      header {
        margin-bottom: 8px;
        display: flex;
        flex-direction: column;
      }
      main {
        width: 100%;
        display: flex;
        flex-direction: column;
      }
      a {
        color: #3273dc;
        cursor: pointer;
        text-decoration: none;
      }
      a:hover {
        color: #000;
      }
      button {
        color: #fff;
        background-color: #3298dc;
        border-color: transparent;
        cursor: pointer;
        text-align: center;
      }
      button:hover {
        background-color: #2793da;
        flex: none;
      }
      .spacer {
        flex: auto;
      }
      .small {
        font-size: 0.75rem;
      }
      footer {
        margin-top: 16px;
        display: flex;
        align-items: center;
      }
      .header-label {
        margin-right: 4px;
      }
      .benchmark-set {
        margin: 8px 0;
        width: 100%;
        display: flex;
        flex-direction: column;
      }
      .benchmark-title {
        font-size: 3rem;
        font-weight: 600;
        word-break: break-word;
        text-align: center;
      }
      .benchmark-graphs {
        display: flex;
        flex-direction: row;
        justify-content: space-around;
        align-items: center;
        flex-wrap: wrap;
        width: 100%;
      }
      .benchmark-chart {
        max-width: 1000px;
      }
    </style>
    <title>Benchmarks</title>
  </head>

  <body>
    <header id="header">
      <div class="header-item">
        <strong class="header-label">Last Update:</strong>
        <span id="last-update"></span>
      </div>
      <div class="header-item">
        <strong class="header-label">Repository:</strong>
        <a id="repository-link" rel="noopener"></a>
      </div>
    </header>
    <main id="main"></main>
    <footer>
      <button id="dl-button">Download data as JSON</button>
      <div class="spacer"></div>
      <div class="small">Powered by <a rel="noopener" href="https://github.com/marketplace/actions/continuous-benchmark">github-action-benchmark</a></div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/chart.js@2.9.2/dist/Chart.min.js"></script>
    <script src="data.js"></script>
    <script id="main-script">
      'use strict';
      (function() {
        // Colors from https://github.com/github/linguist/blob/master/lib/linguist/languages.yml
        const toolColors = {
          cargo: '#dea584',
          go: '#00add8',
          benchmarkjs: '#f1e05a',
          benchmarkluau: '#000080',
          pytest: '#3572a5',
          googlecpp: '#f34b7d',
          catch2: '#f34b7d',
          julia: '#a270ba',
          jmh: '#b07219',
          benchmarkdotnet: '#178600',
          customBiggerIsBetter: '#38ff38',
          customSmallerIsBetter: '#ff3838',
          _: '#333333'
        };

        function init() {
          function collectBenchesPerTestCase(entries) {
            const map = new Map();
            for (const entry of entries) {
              const {commit, date, tool, benches} = entry;
              for (const bench of benches) {
                const result = { commit, date, tool, bench };
                const arr = map.get(bench.name);
                if (arr === undefined) {
                  map.set(bench.name, [result]);
                } else {
                  arr.push(result);
                }
              }
            }
            return map;
          }

          const data = window.BENCHMARK_DATA;

          // Render header
          document.getElementById('last-update').textContent = new Date(data.lastUpdate).toString();
          const repoLink = document.getElementById('repository-link');
          repoLink.href = data.repoUrl;
          repoLink.textContent = data.repoUrl;

          // Render footer
          document.getElementById('dl-button').onclick = () => {
            const dataUrl = 'data:,' + JSON.stringify(data, null, 2);
            const a = document.createElement('a');
            a.href = dataUrl;
            a.download = 'benchmark_data.json';
            a.click();
          };

          // Prepare data points for charts
          return Object.keys(data.entries).map(name => ({
            name,
            dataSet: collectBenchesPerTestCase(data.entries[name]),
          }));
        }

        function renderAllChars(dataSets) {

          // Each `series` entry is { label, dataset, color }. A chart may hold
          // the implementation and its unordered_map baseline as two lines.
          function renderGraph(parent, name, series) {
            const canvas = document.createElement('canvas');
            canvas.className = 'benchmark-chart';
            parent.appendChild(canvas);

            // Unified commit axis across all series (ordered by first appearance).
            const commitOrder = [];
            const seen = new Set();
            for (const s of series) {
              for (const d of s.dataset) {
                if (!seen.has(d.commit.id)) {
                  seen.add(d.commit.id);
                  commitOrder.push(d.commit.id);
                }
              }
            }
            const labels = commitOrder.map(id => id.slice(0, 7));

            // Align each series to the unified axis; keep aligned refs for tooltips.
            const datasets = series.map(s => {
              const byCommit = new Map(s.dataset.map(d => [d.commit.id, d]));
              s.aligned = commitOrder.map(id => byCommit.get(id) || null);
              return {
                label: s.label,
                data: s.aligned.map(d => d ? d.bench.value : null),
                borderColor: s.color,
                backgroundColor: s.color + '60', // Add alpha for #rrggbbaa
                spanGaps: true,
              };
            });

            const unit = series[0] && series[0].dataset.length > 0
              ? series[0].dataset[0].bench.unit : '';
            const data = { labels, datasets };
            const options = {
              scales: {
                xAxes: [
                  {
                    scaleLabel: {
                      display: true,
                      labelString: 'commit',
                    },
                  }
                ],
                yAxes: [
                  {
                    scaleLabel: {
                      display: true,
                      labelString: unit,
                    },
                    ticks: {
                      beginAtZero: true,
                    }
                  }
                ],
              },
              tooltips: {
                callbacks: {
                  afterTitle: items => {
                    const it = items[0];
                    const d = series[it.datasetIndex].aligned[it.index];
                    if (!d) return '';
                    return '\n' + d.commit.message + '\n\n' + d.commit.timestamp + ' committed by @' + d.commit.committer.username + '\n';
                  },
                  label: item => {
                    const d = series[item.datasetIndex].aligned[item.index];
                    let label = item.value;
                    if (d) {
                      const { range, unit } = d.bench;
                      label += ' ' + unit;
                      if (range) {
                        label += ' (' + range + ')';
                      }
                    }
                    return series[item.datasetIndex].label + ': ' + label;
                  },
                  afterLabel: item => {
                    const d = series[item.datasetIndex].aligned[item.index];
                    return d && d.bench.extra ? '\n' + d.bench.extra : '';
                  }
                }
              },
              onClick: (_mouseEvent, activeElems) => {
                if (activeElems.length === 0) {
                  return;
                }
                // XXX: Undocumented. How can we know the index?
                const el = activeElems[0];
                const d = series[el._datasetIndex].aligned[el._index];
                if (d) {
                  window.open(d.commit.url, '_blank');
                }
              },
            };

            new Chart(canvas, {
              type: 'line',
              data,
              options,
            });
          }

          function renderBenchSet(name, benchSet, main) {
            const setElem = document.createElement('div');
            setElem.className = 'benchmark-set';
            main.appendChild(setElem);

            const nameElem = document.createElement('h1');
            nameElem.className = 'benchmark-title';
            nameElem.textContent = name;
            setElem.appendChild(nameElem);

            const graphsElem = document.createElement('div');
            graphsElem.className = 'benchmark-graphs';
            setElem.appendChild(graphsElem);

            // Pair each implementation benchmark with its `_Baseline` counterpart
            // so both render as two lines on one chart.
            const IMPL_COLOR = '#178600';
            const BASELINE_COLOR = '#0b84ce';
            const groups = new Map(); // groupKey -> { impl, baseline }
            const order = [];
            for (const [benchName, benches] of benchSet.entries()) {
              // BM_PutGet is the legacy single-op benchmark; drop it.
              if (benchName === 'BM_PutGet') {
                continue;
              }
              const isBaseline = benchName.includes('_Baseline');
              const key = benchName.replace('_Baseline', '');
              if (!groups.has(key)) {
                groups.set(key, {});
                order.push(key);
              }
              groups.get(key)[isBaseline ? 'baseline' : 'impl'] = benches;
            }

            for (const key of order) {
              const g = groups.get(key);
              const series = [];
              if (g.impl) {
                series.push({ label: key, dataset: g.impl, color: IMPL_COLOR });
              }
              if (g.baseline) {
                series.push({ label: key + ' (unordered_map)', dataset: g.baseline, color: BASELINE_COLOR });
              }
              renderGraph(graphsElem, key, series);
            }
          }

          const main = document.getElementById('main');
          for (const {name, dataSet} of dataSets) {
            renderBenchSet(name, dataSet, main);
          }
        }

        renderAllChars(init()); // Start
      })();
    </script>
  </body>
</html>
