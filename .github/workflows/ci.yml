name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      deployments: write
    concurrency:
      group: gh-pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ${{github.workspace}}/build/_deps
          key: deps-release-${{hashFiles('CMakeLists.txt')}}

      - name: Configure
        run: cmake -B ${{github.workspace}}/build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build ${{github.workspace}}/build --config Release

      - name: Benchmark
        run: ${{github.workspace}}/build/lru_cache_bench --benchmark_format=json --benchmark_out=${{github.workspace}}/benchmark_result.json

      - name: Store benchmark result
        uses: benchmark-action/github-action-benchmark@v1.22.1
        with:
          name: LRU Cache Benchmark
          tool: googlecpp
          output-file-path: ${{github.workspace}}/benchmark_result.json
          github-token: ${{secrets.GITHUB_TOKEN}}
          auto-push: ${{github.event_name == 'push'}}
          alert-threshold: 200%
          comment-on-alert: true
          fail-on-alert: true

  asan-ubsan:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: gh-pages
      cancel-in-progress: false
    env:
      BUILD_DIR: ${{github.workspace}}/build-asan
      COVERAGE_FILE: ${{github.workspace}}/coverage.xml
    steps:
      - uses: actions/checkout@v4

      - name: Cache pip (gcovr)
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-gcovr

      - name: Install gcovr
        run: pip install gcovr

      - name: Cache GoogleTest
        uses: actions/cache@v4
        with:
          path: ${{env.BUILD_DIR}}/_deps
          key: deps-asan-${{hashFiles('CMakeLists.txt')}}

      - name: Configure
        run: >
          cmake -B ${{env.BUILD_DIR}} -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined --coverage"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined --coverage"

      - name: Build
        run: cmake --build ${{env.BUILD_DIR}}

      - name: Test
        working-directory: ${{env.BUILD_DIR}}
        run: ctest --output-on-failure

      - name: Generate coverage report
        run: |
          mkdir -p ${{github.workspace}}/coverage
          gcovr --root ${{github.workspace}} --filter ${{github.workspace}}/src/ \
            --xml -o ${{env.COVERAGE_FILE}} \
            --html-details -o ${{github.workspace}}/coverage/index.html

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ${{env.COVERAGE_FILE}}
          fail_ci_if_error: true

      - name: Assemble Pages site
        run: |
          mkdir -p ${{github.workspace}}/site/coverage
          cp -r ${{github.workspace}}/coverage/. ${{github.workspace}}/site/coverage/
          cat > ${{github.workspace}}/site/index.html << 'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head><meta charset="utf-8"><title>lru-cache</title></head>
          <body>
            <h1>lru-cache</h1>
            <ul>
              <li><a href="dev/bench/">Benchmarks</a></li>
              <li><a href="coverage/">Coverage</a></li>
            </ul>
          </body>
          </html>
          EOF

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        if: github.event_name == 'push'
        with:
          github_token: ${{secrets.GITHUB_TOKEN}}
          publish_dir: ${{github.workspace}}/site
          keep_files: true

  tsan:
    runs-on: ubuntu-latest
    env:
      BUILD_DIR: ${{github.workspace}}/build-tsan
    steps:
      - uses: actions/checkout@v4

      - name: Cache GoogleTest
        uses: actions/cache@v4
        with:
          path: ${{env.BUILD_DIR}}/_deps
          key: deps-tsan-${{hashFiles('CMakeLists.txt')}}

      - name: Configure
        run: >
          cmake -B ${{env.BUILD_DIR}} -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_FLAGS="-fsanitize=thread"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=thread"

      - name: Build
        run: cmake --build ${{env.BUILD_DIR}}

      - name: Test
        working-directory: ${{env.BUILD_DIR}}
        env:
          TSAN_OPTIONS: "halt_on_error=1:detect_deadlocks=1"
        run: ctest --output-on-failure
