name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize]

# Opt into Node.js 24 before the forced migration on 2026-06-16.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write    # github-action-benchmark writes benchmark history to gh-pages
      deployments: write
    # Serialize gh-pages writes so concurrent jobs don't produce push conflicts.
    concurrency:
      group: gh-pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      # Restore FetchContent downloads (googletest, googlebenchmark) across runs.
      # Cache is keyed on CMakeLists.txt so a dependency version bump busts it.
      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ${{github.workspace}}/build/_deps
          key: deps-release-${{hashFiles('CMakeLists.txt')}}

      - name: Configure
        run: cmake -B ${{github.workspace}}/build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build ${{github.workspace}}/build --config Release

      - name: Benchmark
        run: ${{github.workspace}}/build/lru_cache_bench --benchmark_format=json --benchmark_out=${{github.workspace}}/benchmark_result.json

      # Appends results to gh-pages and renders the trend chart.
      # auto-push is gated on push (not pull_request) to avoid write-access
      # failures from fork PRs, while still running the comparison on PRs.
      - name: Store benchmark result
        uses: benchmark-action/github-action-benchmark@v1.22.1
        with:
          name: LRU Cache Benchmark
          tool: googlecpp
          output-file-path: ${{github.workspace}}/benchmark_result.json
          github-token: ${{secrets.GITHUB_TOKEN}}
          auto-push: ${{github.event_name == 'push'}}
          alert-threshold: 200%
          comment-on-alert: true  # posts on the merge commit when a regression slips through
          fail-on-alert: true     # also fails the PR job if the branch itself regresses

  asan-ubsan:
    runs-on: ubuntu-latest
    env:
      BUILD_DIR: ${{github.workspace}}/build-asan
      COVERAGE_FILE: ${{github.workspace}}/coverage.xml
    steps:
      - uses: actions/checkout@v4

      - name: Cache pip (gcovr)
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-gcovr

      - name: Install gcovr
        run: pip install gcovr

      - name: Cache GoogleTest
        uses: actions/cache@v4
        with:
          path: ${{env.BUILD_DIR}}/_deps
          key: deps-asan-${{hashFiles('CMakeLists.txt')}}

      # ASan catches use-after-free, buffer overflows, and related memory errors.
      # UBSan catches undefined behaviour: signed overflow, null deref, bad shifts.
      # --coverage instruments for line/branch coverage; the linker flag is also
      # required because the coverage runtime is linked as a library.
      - name: Configure
        run: >
          cmake -B ${{env.BUILD_DIR}} -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined --coverage"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined --coverage"

      - name: Build
        run: cmake --build ${{env.BUILD_DIR}}

      - name: Test
        working-directory: ${{env.BUILD_DIR}}
        run: ctest --output-on-failure

      - name: Generate coverage report
        run: |
          gcovr --root ${{github.workspace}} \
            --object-directory ${{env.BUILD_DIR}} \
            --filter ${{github.workspace}}/src/ \
            --xml -o ${{env.COVERAGE_FILE}}

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ${{env.COVERAGE_FILE}}
          fail_ci_if_error: true

  tsan:
    runs-on: ubuntu-latest
    env:
      BUILD_DIR: ${{github.workspace}}/build-tsan
    steps:
      - uses: actions/checkout@v4

      - name: Cache GoogleTest
        uses: actions/cache@v4
        with:
          path: ${{env.BUILD_DIR}}/_deps
          key: deps-tsan-${{hashFiles('CMakeLists.txt')}}

      # TSan detects data races and deadlocks. It is incompatible with ASan/MSan
      # due to conflicting shadow memory schemes, so it runs as a separate job.
      - name: Configure
        run: >
          cmake -B ${{env.BUILD_DIR}} -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_FLAGS="-fsanitize=thread"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=thread"

      - name: Build
        run: cmake --build ${{env.BUILD_DIR}}

      - name: Test
        working-directory: ${{env.BUILD_DIR}}
        env:
          # halt_on_error: exit immediately on first race instead of continuing.
          # detect_deadlocks: also report mutex deadlocks, not just data races.
          TSAN_OPTIONS: "halt_on_error=1:detect_deadlocks=1"
        run: ctest --output-on-failure
