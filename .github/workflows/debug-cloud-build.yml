name: debug-cloud-build

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize]

env:
  BUILD_TYPE: Debug
  COVERAGE_FILE: ${{github.workspace}}/coverage.xml

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Cache pip (gcovr)
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: pip-gcovr

    - name: Install gcovr
      run: pip install gcovr

    - name: Cache GoogleTest
      uses: actions/cache@v4
      with:
        path: ${{github.workspace}}/build/_deps
        key: gtest-${{hashFiles('CMakeLists.txt')}}

    - name: Configure CMake
      run: cmake -B ${{github.workspace}}/build -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} -DCMAKE_CXX_FLAGS="--coverage" -DCMAKE_EXE_LINKER_FLAGS="--coverage"

    - name: Build
      run: cmake --build ${{github.workspace}}/build --config ${{env.BUILD_TYPE}}

    - name: Test
      working-directory: ${{github.workspace}}/build
      run: ctest -C ${{env.BUILD_TYPE}} --output-on-failure

    - name: Generate coverage report
      run: gcovr --root ${{github.workspace}} --filter ${{github.workspace}}/src/ --xml -o ${{env.COVERAGE_FILE}}

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v5
      with:
        files: ${{env.COVERAGE_FILE}}
        fail_ci_if_error: true

